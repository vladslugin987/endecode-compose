# ─────────────────────────────────────────────────────────────────────────────
# ENDEcode Release Workflow
#
# Triggered when you push a tag like  v1.2.3
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Builds signed installers for:
#   • macOS  Apple Silicon  (aarch64-apple-darwin)
#   • macOS  Intel         (x86_64-apple-darwin)
#   • Windows x64          (x86_64-pc-windows-msvc)
#
# Publishes a GitHub Release with:
#   • .dmg / .msi installers  ← download count goes to your GitHub stats
#   • latest.json             ← used by the in-app updater
#
# ── Required GitHub Secrets ───────────────────────────────────────────────────
#   TAURI_SIGNING_PRIVATE_KEY          (generate once, see README)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (can be empty string)
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: endecode-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: endecode-tauri/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # Expect a one-line base64-encoded secret key in GitHub Secrets.
      - name: Validate updater signing key format
        shell: bash
        env:
          INPUT_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_SIGNING_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty or missing"
            exit 1
          fi

          if printf '%s' "${INPUT_SIGNING_KEY}" | grep -q '^untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must contain the one-line base64 content of the .key file, not decoded raw key text"
            exit 1
          fi

          if ! printf '%s' "${INPUT_SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/tauri-signing.key.decoded"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not valid base64"
            exit 1
          fi

          if ! head -n 1 "${RUNNER_TEMP}/tauri-signing.key.decoded" | grep -q '^untrusted comment: .*secret key'; then
            echo "::error::Decoded signing key has invalid format (missing secret key header)"
            exit 1
          fi

      - name: Validate updater signing key early
        shell: bash
        env:
          INPUT_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE }}
        run: |
          set -euo pipefail
          VALIDATION_FILE="${RUNNER_TEMP}/tauri-signing-validation.txt"
          printf 'validate updater signing key\n' > "${VALIDATION_FILE}"

          if [ -n "${KEY_PASSWORD}" ]; then
            npm run tauri signer sign -- -k "${INPUT_SIGNING_KEY}" -p "${KEY_PASSWORD}" "${VALIDATION_FILE}"
          else
            npm run tauri signer sign -- -k "${INPUT_SIGNING_KEY}" "${VALIDATION_FILE}"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: endecode-tauri/src-tauri -> target

      # ── Unpack vendor bundle (offline Rust deps) ──────────────────────────
      # Download the latest vendor artifact from vendor-refresh workflow.
      - name: Download vendor artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: vendor-refresh.yml
          name: endecode-tauri-rust-vendor
          path: endecode-tauri/src-tauri/vendor-bundle

      - name: Unpack vendor
        shell: bash
        run: |
          tar -xzf src-tauri/vendor-bundle/endecode-tauri-rust-vendor.tar.gz \
              -C src-tauri

      # ── Build & publish ───────────────────────────────────────────────────
      - name: Build and publish release (without password)
        if: env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: endecode-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ENDEcode v__VERSION__"
          releaseBody: |
            ## What's new
            See commit history for changes.

            ---
            **Downloads counted here automatically appear in your GitHub repository statistics.**
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build and publish release (with password)
        if: env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE }}
        with:
          projectPath: endecode-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ENDEcode v__VERSION__"
          releaseBody: |
            ## What's new
            See commit history for changes.

            ---
            **Downloads counted here automatically appear in your GitHub repository statistics.**
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
